[project]
name = "yt-agent"
version = "0.1.0"
description = "Open-source YouTube intelligence tool for AI agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "KVK Satish" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.15.0",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=0.6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
yt-agent = "yt_agent.cli:app"

[project.urls]
Homepage = "https://github.com/kvksatish/yt-agent"
Repository = "https://github.com/kvksatish/yt-agent"
Issues = "https://github.com/kvksatish/yt-agent/issues"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
